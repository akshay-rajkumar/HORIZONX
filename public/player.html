<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Watch — HorizonX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&family=Jost:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="player.css"/>
</head>
<body>

  <!-- UBLOCK BANNER -->
  <div id="adBanner" class="ad-banner">
    <div class="ad-banner-left">
      <svg width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>
        For an <strong>ad-free experience</strong>, install
        <a
          href="https://ublockorigin.com"
          target="_blank"
          rel="noopener noreferrer"
          class="ad-banner-link"
        >uBlock Origin</a>
        — it's free.
      </span>
    </div>
    <div class="ad-banner-right">
      <a
        href="https://ublockorigin.com"
        target="_blank"
        rel="noopener noreferrer"
        class="ad-banner-btn"
      >
        Install Free
      </a>
      <button class="ad-banner-close" id="adBannerClose"
        aria-label="Dismiss">
        ✕
      </button>
    </div>
  </div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="back-btn" onclick="window.location.href='/'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back
    </button>
    <div class="top-brand">
      <span style="color:#E0102A;">◈</span> HORIZONX
    </div>
  </div>

  <!-- PLAYER AREA -->
  <div class="player-area">

    <!-- Loading spinner -->
    <div id="loadingSpinner" class="loading-spinner">
      <div class="spinner-ring"></div>
    </div>

    <!-- THE IFRAME — this is the video -->
    <iframe
      id="playerFrame"
      src=""
      frameborder="0"
      scrolling="no"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      referrerpolicy="no-referrer"
      style="position:absolute;inset:0;width:100%;height:100%;border:none;background:#000;"
    ></iframe>

    <!-- Info panel (slides in from right) -->
    <div id="infoPanel" class="info-panel">
      <button class="panel-close-btn" id="infoPanelClose">✕</button>
      <img id="infoPoster" class="info-poster" src="" alt=""/>
      <div class="info-body">
        <h2 class="info-title" id="infoTitle"></h2>
        <div class="info-meta" id="infoMeta"></div>
        <div class="info-genres" id="infoGenres"></div>
        <p class="info-desc" id="infoDesc"></p>
      </div>
    </div>

    <!-- Episode panel (slides up from bottom) -->
    <div id="episodePanel" class="episode-panel">
      <div class="ep-panel-header">
        <h2 class="ep-panel-title">EPISODES</h2>
        <button class="panel-close-btn" id="episodePanelClose">✕</button>
      </div>
      <div class="season-tabs-wrap">
        <div class="season-tabs" id="seasonTabs"></div>
      </div>
      <div class="episode-grid-wrap">
        <div class="episode-grid" id="episodeGrid"></div>
      </div>
    </div>

    <!-- Backdrop (closes panels) -->
    <div id="panelBackdrop" class="panel-backdrop"></div>

  </div><!-- end .player-area -->

  <!-- BOTTOM TOOLBAR -->
  <div class="player-toolbar">
    <span class="toolbar-brand">HORIZONX</span>
    <div class="toolbar-right">
      <button id="btnPrev"     class="toolbar-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg> PREV</button>
      <button id="btnNext"     class="toolbar-btn">NEXT <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>
      <button id="btnEpisodes" class="toolbar-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8L2 7h20z"/></svg> EPISODES</button>
      <button id="btnInfo"     class="toolbar-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> INFO</button>
    </div>
  </div>

  <script src="player.js"></script>
  <script>
    (function() {
      /* Don't show banner if user already dismissed it */
      if (localStorage.getItem('hx_ubanner_dismissed') === '1') {
        var b = document.getElementById('adBanner');
        if (b) b.style.display = 'none';
        document.body.classList.add('banner-gone');
        return;
      }
      var closeBtn = document.getElementById('adBannerClose');
      if (closeBtn) {
        closeBtn.addEventListener('click', function() {
          var banner = document.getElementById('adBanner');
          if (banner) {
            banner.style.maxHeight = '0';
            banner.style.opacity   = '0';
            setTimeout(function() {
              banner.style.display = 'none';
              document.body.classList.add('banner-gone');
            }, 400);
          }
          localStorage.setItem('hx_ubanner_dismissed', '1');
        });
      }
    })();
  </script>
</body>
</html>
